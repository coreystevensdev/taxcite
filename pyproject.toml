[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taxcite"
version = "0.1.0"
description = "Agentic RAG over IRS publications with a verifiable eval harness"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Corey Stevens" }]
dependencies = [
  "httpx>=0.27",
  "pdfplumber>=0.11",
  "voyageai>=0.3",
  "psycopg2-binary>=2.9",
  "pgvector>=0.4",
  "numpy>=1.26",
  "langgraph>=1.0.10,<2",
  "langsmith>=0.8.18,<1",
  "anthropic>=0.50,<2.0",
  "rolling-cost-cap>=0.1",
  "fastapi>=0.115",
  "slowapi>=0.1.9",
  "uvicorn[standard]>=0.30",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-httpx>=0.34",
  "ruff>=0.16,<0.17",
]
eval = [
  "ragas>=0.2",
  "datasets>=2.20",
  # ragas/llms/base.py imports langchain_community.chat_models.vertexai, which
  # 0.4 removed. Without this bound `pip install .[eval]` resolves to a pair that
  # cannot import ragas at all, so the eval extra was uninstallable as written.
  "langchain-community>=0.3,<0.4",
  # eval_harness._judge_llm and _judge_embeddings import these inside the
  # function body, so nothing fails until an eval actually runs. Neither was
  # ever declared, so `pip install -e '.[eval]'` could not import either one.
  # Three layers missed it: the suite never calls those functions, tests.yml
  # installs .[dev] rather than .[eval], and weekly-eval.yml skips for want of
  # an API key.
  #
  # The langchain-anthropic floor is 1.7 and not 0.3 on purpose: every release
  # before 1.7 caps anthropic below 1.0, so a bare `>=0.3` resolves and
  # silently drags the SDK from 1.17.0 back to 0.125.0. 1.7.12 asks for
  # anthropic>=0.120.0 with no ceiling, which leaves it alone.
  "langchain-anthropic>=1.7",
  "langchain-voyageai>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/taxcite"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
