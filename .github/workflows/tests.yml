name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: taxcite
          POSTGRES_PASSWORD: taxcite
          POSTGRES_DB: taxcite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://taxcite:taxcite@localhost:5432/taxcite_test
      LANGCHAIN_TRACING_V2: 'false'
      LANGCHAIN_PROJECT: taxcite-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short -x

      - name: README test count matches what pytest collects
        run: |
          n=$(pytest tests/ --collect-only -q | grep -oE '^[0-9]+ tests? collected' | grep -oE '^[0-9]+')
          [ -n "$n" ] || { echo "could not parse a count out of pytest"; exit 1; }
          fail=0
          grep -q "tests-$n-brightgreen" README.md || { echo "badge does not say $n"; fail=1; }
          grep -q "$n tests (pytest)" README.md || { echo "overview line does not say $n"; fail=1; }
          [ "$fail" = 0 ] || { echo "pytest collects $n. Update both spots in README.md."; exit 1; }
          echo "README agrees with pytest: $n"
