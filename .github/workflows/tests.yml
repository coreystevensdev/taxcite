name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: taxcite
          POSTGRES_PASSWORD: taxcite
          POSTGRES_DB: taxcite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://taxcite:taxcite@localhost:5432/taxcite_test
      LANGCHAIN_TRACING_V2: 'false'
      LANGCHAIN_PROJECT: taxcite-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short -x

      - name: uv.lock still matches pyproject.toml
        # The lock installs nothing; pip does, from pyproject.toml above. It
        # exists so GitHub's dependency graph sees the whole transitive tree
        # rather than only the declared deps, which here is 140 packages against
        # 29. A lock nothing enforces drifts, and a drifted lock makes the scan
        # precise and wrong, so this fails when the two disagree.
        run: |
          pip install --quiet uv
          uv lock --check

      - name: README test count matches what pytest collects
        run: |
          n=$(pytest tests/ --collect-only -q | grep -oE '^[0-9]+ tests? collected' | grep -oE '^[0-9]+')
          [ -n "$n" ] || { echo "could not parse a count out of pytest"; exit 1; }
          fail=0
          grep -q "tests-$n-brightgreen" README.md || { echo "badge does not say $n"; fail=1; }
          grep -q "$n tests (pytest)" README.md || { echo "overview line does not say $n"; fail=1; }
          [ "$fail" = 0 ] || { echo "pytest collects $n. Update both spots in README.md."; exit 1; }
          echo "README agrees with pytest: $n"

  image:
    name: Image builds and can import itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The test suite runs from the repo, so it passes whether or not the
      # package installs into the image. This is the only thing that notices.
      - name: Build and import
        run: |
          docker build -t taxcite-smoke .
          docker run --rm taxcite-smoke python -c "import taxcite; print(taxcite.__name__, 'imports')"
          docker run --rm taxcite-smoke python -m taxcite --help > /dev/null

      # The report path resolved from __file__, which lands in site-packages
      # once installed, so the repo layout made the local test pass and the
      # container return 404. Only a request against the image sees that.
      - name: The eval report is served from the image
        run: |
          docker run -d --name smoke -p 8099:8000 taxcite-smoke
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8099/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:8099/
          curl -fsS http://127.0.0.1:8099/eval/report.json | head -c 80
          docker rm -f smoke
